<meta charset="utf-8">
<title>Ligne de Front – Atelier</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Special+Elite&family=IBM+Plex+Sans:wght@400;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  /* Layout: a field-dossier contact sheet. One dark olive look on purpose (the game's own palette), pixel art at integer zoom. */
  :root {
    --bg: #1b1e16; --panel: #252a1e; --line: #3d4330; --fg: #e6dcc0; --dim: #a39d84; --accent: #f0d98a;
    --allied: #4f93c9; --axis: #d0663a;
    --f-display: "Special Elite", "Courier New", monospace;
    --f-body: "IBM Plex Sans", system-ui, sans-serif;
    --f-mono: "IBM Plex Mono", ui-monospace, monospace;
    --z: 3; color-scheme: dark;
  }
  body { background: var(--bg); color: var(--fg); font: 15px/1.5 var(--f-body); }
  .wrap { max-width: 1280px; margin: 0 auto; padding-block: 32px 64px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 44px; }
  header { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 16px; border-bottom: 1px solid var(--line); padding-bottom: 20px; }
  h1 { font: 44px/1 var(--f-display); margin: 0; letter-spacing: 1px; text-wrap: balance; }
  header p { margin: 8px 0 0; color: var(--dim); max-width: 62ch; }
  .zoom { display: flex; gap: 6px; align-items: center; font: 13px var(--f-mono); color: var(--dim); }
  .zoom button { font: 500 13px var(--f-mono); color: var(--fg); background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 6px 10px; cursor: pointer; }
  .zoom button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
  .zoom button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  section { display: grid; gap: 16px; }
  h2 { font: 24px var(--f-display); margin: 0; display: flex; gap: 12px; align-items: baseline; flex-wrap: wrap; }
  h2 small { font: 12px var(--f-mono); color: var(--dim); letter-spacing: .5px; }
  .grid { display: flex; flex-wrap: wrap; gap: 18px; }
  figure { margin: 0; display: grid; gap: 6px; align-content: start; min-width: 0; }
  figure img { width: calc(var(--w) * var(--z) * 1px); max-width: 100%; height: auto; image-rendering: pixelated; display: block; border: 1px solid #000; background: #000; }
  figcaption { font-size: 13px; line-height: 1.35; max-width: calc(var(--w) * var(--z) * 1px); }
  figcaption b { display: block; font-weight: 600; }
  figcaption span { font: 11px var(--f-mono); color: var(--dim); }
  .pair { display: flex; gap: 6px; }
  .pair img:first-child { border-color: var(--allied); } .pair img:last-child { border-color: var(--axis); }
  .tag { font: 11px var(--f-mono); padding: 1px 6px; border-radius: 3px; border: 1px solid var(--line); color: var(--dim); }
  .icons { display: flex; flex-wrap: wrap; gap: 14px; }
  .chip { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-radius: 6px; color: #1c1a10; font: 600 14px var(--f-body); }
  .chip img { height: calc(9px * var(--z)); image-rendering: pixelated; }
  .map img { width: 100%; max-width: calc(320px * var(--z)); }
  .map figcaption { max-width: none; }
  @media (max-width: 600px) { h1 { font-size: 32px; } }
</style>

<div class="wrap">
  <header>
    <div>
      <h1 id="g-title">Ligne de Front – Atelier</h1>
      <p id="g-intro"></p>
    </div>
    <div class="zoom" role="group" aria-label="Zoom"><button id="g-lang" type="button"></button> Zoom
      <button id="z2" data-z="2">×2</button><button id="z3" data-z="3" aria-pressed="true">×3</button><button id="z4" data-z="4">×4</button>
    </div>
  </header>
  <section><h2><span id="h-units"></span> <small id="n-units"></small></h2><div class="grid" id="units"></div></section>
  <section><h2><span id="h-orders"></span> <small id="n-orders"></small></h2><div class="grid" id="orders"></div></section>
  <section><h2><span id="h-base"></span> <small id="n-base"></small></h2><div class="grid" id="base"></div></section>
  <section><h2><span id="h-camp"></span> <small id="n-camp"></small></h2><div class="grid" id="camp"></div></section>
  <section class="map"><h2><span id="h-map"></span> <small>320 × 140 px</small></h2>
    <figure><img id="g-map" alt="" style="--w:320"><figcaption><span id="g-mapnote"></span></figcaption></figure>
  </section>
  <section><h2><span id="h-icons"></span> <small>15 × 9 px environ</small></h2><div class="icons" id="icons"></div></section>
</div>

<script src="engine.js?v=3"></script>
<script src="packs/normandie/pack.js?v=3"></script>
<script src="packs/normandie/cards.js?v=3"></script>
<script src="packs/normandie/terrains.js?v=3"></script>
<script src="packs/normandie/battles.js?v=3"></script>
<script src="i18n.js?v=3"></script>
<script>
  // Gallery of one campaign pack: assets.html?pack=<id> (default: the first one).
  const want = new URLSearchParams(location.search).get('pack');
  E.use(PACKS[want] ? want : Object.keys(PACKS)[0]);
  const S = E.PACK.art + 'scenes/', T = E.TERRAINS, C = E.CARDS, I = I18N, L = I18N.t, $ = id => document.getElementById(id);
  try { I.lang = localStorage.getItem('ldf-lang') || (navigator.language.startsWith('fr') ? 'fr' : 'en'); } catch {}
  const fig = (src, w, title, sub) => `<figure><img src="${src}" alt="${title}" style="--w:${w}" loading="lazy"><figcaption><b>${title}</b><span>${sub}</span></figcaption></figure>`;
  const img = k => C[k].art || k;
  const units = Object.keys(C).filter(k => C[k].type !== E.ORDER && k !== 'inconnu');
  const orders = Object.keys(C).filter(k => C[k].type === E.ORDER);
  const base = E.PACK.quick, camp = Object.keys(T).filter(k => !base.includes(k));
  const traitName = k => T[T[k].trait] ? I.terrainName(T[k].trait) : T[k].trait[0].toUpperCase() + T[k].trait.slice(1);
  function render() {
    document.documentElement.lang = I.lang; document.title = L('gTitle');
    $('g-title').textContent = L('gTitle'); $('g-intro').textContent = L('gIntro'); $('g-lang').textContent = L('lang'); $('g-mapnote').textContent = L('gMapNote');
    for (const [id, k] of [['h-units', 'gUnits'], ['h-orders', 'gOrders'], ['h-base', 'gBase'], ['h-camp', 'gCamp'], ['h-map', 'gMap'], ['h-icons', 'gIcons']]) $(id).textContent = L(k);
    $('units').innerHTML = units.map(k => `<figure><div class="pair">
        <img src="${S}c_${img(k)}.png" alt="${I.cardName(k, 0)}" style="--w:64" loading="lazy"><img src="${S}c_${img(k)}_x.png" alt="${I.cardName(k, 1)}" style="--w:64" loading="lazy"></div>
        <figcaption><b>${I.cardName(k, 0)} / ${I.cardName(k, 1)}</b><span>${I.typeName(C[k].type)} · 64 × 40 px · ${L('gSides')}</span></figcaption></figure>`).join('');
    $('orders').innerHTML = orders.map(k => fig(`${S}c_${img(k)}.png`, 64, I.cardName(k, 0), `${I.typeName(E.ORDER)} · 64 × 40 px`)).join('') + fig(`${S}c_back.png`, 64, L('gBack'), '64 × 40 px');
    $('base').innerHTML = base.map(k => fig(`${S}t_${k}.png`, 160, I.terrainName(k), `${I.terrainText(k)} · 160 × 72 px`)).join('');
    $('camp').innerHTML = camp.map(k => fig(`${S}t_${k}.png`, 160, I.terrainName(k), `${L('gVariant', traitName(k))} · 160 × 72 px`)).join('');
    $('n-units').textContent = L('gCamps', units.length); $('n-orders').textContent = L('gIll', orders.length + 1);
    $('n-base').textContent = `${base.length} · 160 × 72 px`; $('n-camp').textContent = `${camp.length} · 160 × 72 px`;
    const COL = ['#93a84e', '#d2a544', '#73b4d6', '#b993dc'];
    $('g-map').src = `${S}${E.PACK.map.image}.png`; $('g-map').alt = I.pack('title');
    $('icons').innerHTML = E.PACK.icons.map((k, a) => `<div class="chip" style="background:${COL[a]}"><img src="${E.PACK.art}sprites/i_${k}.png" alt="">${I.attrName(a)}</div>`).join('');
  }
  $('g-lang').addEventListener('click', () => { I.lang = I.lang === 'fr' ? 'en' : 'fr'; try { localStorage.setItem('ldf-lang', I.lang); } catch {} render(); });
  // Integer zoom only: fractional scaling blurs pixel art.
  const zoom = z => { document.documentElement.style.setProperty('--z', z); document.querySelectorAll('[data-z]').forEach(b => b.setAttribute('aria-pressed', b.dataset.z == z)); try { localStorage.setItem('ldf-atelier-z', z); } catch {} };
  document.querySelectorAll('[data-z]').forEach(b => b.addEventListener('click', () => zoom(b.dataset.z)));
  try { const z = localStorage.getItem('ldf-atelier-z'); if (z) zoom(z); } catch {}
  render();
</script>
