<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Ligne de Front</title>
<style>
  /* Titles (game name, terrain and battle names, stamps, banners): army stencil lettering. Texts stay in Georgia.
     Stardos Stencil Bold, SIL Open Font License (fonts/OFL.txt), served from the repo: no outside request. */
  @font-face { font-family:"Stardos Stencil"; font-weight:700; font-display:swap; src:url(fonts/StardosStencil-Bold.woff2) format("woff2"); }
  :root { --title:"Stardos Stencil",Georgia,serif; --me:#4f93c9; --ai:#d0663a; --paper:#dccba3; --ink:#2a2418; --olive:#5b6236;
          --a0:#93a84e; --a1:#d2a544; --a2:#73b4d6; --a3:#b993dc;
          /* Era look: Normandy values here, a pack's `theme` overrides them (usePack), its `font: 'serif'` swaps the titles. */
          --btn:#3a3d2c; --btnHi:#4c5038; --edge:#6d6a4c; --bg1:#3a4033; --bg2:#22261e; --bg3:#14160f;
          --panel:#202318; --panelEdge:#4a4f38; --tile1:#35402a; --tile2:#262d1f; }
  body[data-font=serif] { --title:Georgia,"Times New Roman",serif; }
  * { box-sizing:border-box; }
  body { margin:0; height:100vh; display:flex; flex-direction:column; color:#e6dcc0; font:14px/1.35 Georgia,serif;
         background:radial-gradient(ellipse at 50% 40%,var(--bg1) 0%,var(--bg2) 60%,var(--bg3) 100%); overflow:hidden; }
  button { font:inherit; color:var(--paper); background:var(--btn); border:1px solid var(--edge); border-radius:4px; padding:5px 12px; cursor:pointer; }
  button:hover:not(:disabled) { background:var(--btnHi); } button:disabled { opacity:.35; cursor:default; }
  button.on { background:var(--olive); border-color:#c9c27a; }
  #top { display:flex; align-items:center; gap:18px; padding:8px 16px; background:#0006; border-bottom:1px solid #000; }
  #top h1 { margin:0; font-family:var(--title); font-size:19px; letter-spacing:2px; text-transform:uppercase; color:var(--paper); }
  #top .sp { flex:1; } #clock b { color:#f0d98a; }
  #wrap { flex:1; display:flex; min-height:0; }
  #log { width:250px; padding:10px; overflow:auto; background:#0004; border-right:1px solid #000; font:12px/1.5 "Courier New",monospace; color:#b9b091; }
  #log h2 { font:bold 12px Georgia,serif; letter-spacing:2px; text-transform:uppercase; margin:0 0 6px; color:var(--paper); }
  #log p { margin:0 0 3px; } #log p:first-of-type { color:#fff; }
  main { flex:1; display:flex; flex-direction:column; padding:8px 16px; min-width:0; gap:6px; }
  #ai { display:flex; justify-content:center; align-items:center; gap:4px; height:34px; color:#b9b091; font-size:12px; }
  .back { width:24px; height:32px; border-radius:3px; background:repeating-linear-gradient(45deg,#4a3323,#4a3323 4px,#5c4130 4px,#5c4130 8px); border:1px solid #1a120b; }
  #front { flex:1; display:grid; grid-template-columns:repeat(3,1fr); gap:14px; min-height:0; }
  .col { display:flex; flex-direction:column; justify-content:center; gap:6px; padding:6px; border-radius:8px; border:2px solid transparent; min-height:0; }
  .u.target, .card.target { outline:2px dashed #f0d98a; outline-offset:1px; cursor:pointer; animation:pulse 1.1s infinite; }
  @keyframes pulse { 50% { outline-color:#f0d98a55; } }
  /* Highlights follow the action bar state (main[data-st]): blue = where the selected card can go, yellow = targets of a pending power or order. */
  main { --hl:#e6cf7a; --ui:"IBM Plex Sans Condensed","Helvetica Neue",Arial,sans-serif; } main[data-st=card] { --hl:#8fc0ea; }
  .col.target { cursor:pointer; } .col.dim { opacity:.5; }
  .col.target > .terrain { border:2px dashed var(--hl); box-shadow:0 0 0 2px #0008, 0 0 14px var(--hl); }
  main[data-st=pend] .u.target { outline-width:3px; box-shadow:0 0 14px #e6cf7a99; }
  .u.target, .u.ghost { position:relative; overflow:visible; }
  .u.ghost { border:2px dashed #e6cf7a; opacity:.75; }
  .pill { font:bold 11px/1.5 var(--ui); font-style:normal; letter-spacing:0; text-transform:none; padding:1px 8px; border-radius:9px; white-space:nowrap; background:#e6cf7a; color:#1a1a12; }
  .pill.here { background:#8fc0ea; color:#10161c; }
  .u .pill, .pill.stake { position:absolute; left:50%; transform:translateX(-50%); top:-10px; z-index:1; } .u.ghost .pill { top:auto; bottom:-9px; }
  .slot.blocked { display:flex; align-items:center; justify-content:center; text-align:center; font:10px var(--ui); color:#7d7a63;
                  background:repeating-linear-gradient(135deg,#1d1f17 0 6px,#24271c 6px 12px); }
  .slots { display:flex; gap:5px; justify-content:center; height:104px; }
  .slot, .u { flex:0 1 112px; border-radius:5px; height:100%; }
  .slot { border:1px dashed #ffffff26; }
  .u { background:#000 center/cover no-repeat; image-rendering:pixelated; color:var(--paper); font-size:13px; border:2px solid var(--me); display:flex; flex-direction:column; justify-content:space-between; overflow:hidden; }
  .u b, .u em { background:#000b; padding:1px 4px; } .u .vals { padding:2px 3px; }
  .u.side1 { border-color:var(--ai); }
  .u b { line-height:1.15; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; } .u em { font-size:11px; align-self:flex-start; }
  /* One value chip everywhere (hand, board, threshold): always 4 columns in Char/Inf/Air/Strat order, same colours. */
  .vals { display:flex; gap:3px; font-style:normal; }
  .vals i { flex:1; text-align:center; font-style:normal; font-weight:bold; font-size:17px; line-height:1.3; border-radius:4px; color:#1c1a10; white-space:nowrap; }
  i.c0a { background:var(--a0); } i.c1a { background:var(--a1); } i.c2a { background:var(--a2); } i.c3a { background:var(--a3); }
  .vals i.z { opacity:.25; }
  .vals i img { height:.62em; margin-right:.2em; image-rendering:pixelated; }
  .u .vals { padding:3px; } .u .vals i { font-size:20px; line-height:1.15; } .u .vals i.z { background:#000; color:#fff; opacity:.45; }
  .vals.thr i { font-size:16px; line-height:30px; } .vals.thr i.z { opacity:.35; } .vals.thr i img { height:15px; vertical-align:-2px; }
  /* "Missing" rows around the threshold: what each side still needs, per attribute (same maths as the capture: E.lack). */
  .lack { display:flex; align-items:center; gap:5px; min-height:30px; padding:3px 8px; border-radius:5px; font:bold 11px var(--ui); }
  .lack.p1 { background:#2b2018; color:#f0956a; } .lack.p0 { background:#17202a; color:#8fc0ea; }
  .lack > b { flex:0 0 72px; }
  .lack i { display:inline-flex; align-items:center; gap:3px; height:22px; padding:0 6px; border-radius:4px; font-style:normal; font-size:13px; color:#1a1a12; white-space:nowrap; }
  .lack i img { height:11px; image-rendering:pixelated; }
  .lack i.chg { outline:1px dashed #e6cf7a; outline-offset:1px; } .lack i.gone { text-decoration:line-through; opacity:.55; }
  .lack i.met { padding:0; color:inherit; } .lack i.unk { color:#f0956a; border:1px dashed #f0956a; }
  .lack i.fx { background:#5a2b20; color:#f7e2d6; font-size:11px; font-weight:normal; border-radius:11px; }
  .lack .tot { margin-left:auto; font-weight:normal; opacity:.8; white-space:nowrap; }
  .terrain { position:relative; flex:0 1 auto; background:linear-gradient(var(--tile1),var(--tile2)); border:2px solid var(--edge); border-radius:8px; padding:8px 10px; display:flex; flex-direction:column; gap:4px; min-height:0; }
  .terrain.h0 { border-color:var(--me); box-shadow:0 0 14px #4f93c988; } .terrain.h1 { border-color:var(--ai); box-shadow:0 0 14px #d0663a88; }
  .terrain.c0 img.art, .terrain.c1 img.art { filter:saturate(.35) brightness(.8); } .terrain.c0 { border-color:var(--me); } .terrain.c1 { border-color:var(--ai); }
  .tname > span:first-child { font-family:var(--title); font-weight:700; }
  .tname { display:flex; justify-content:space-between; align-items:baseline; font-size:17px; color:var(--paper); letter-spacing:1px; text-transform:uppercase; }
  .tname .tags { display:flex; gap:6px; align-items:center; flex:none; }
  .badge { font-size:11px; letter-spacing:0; text-transform:none; padding:1px 7px; border-radius:9px; background:#0006; }
  .h0 .badge, .c0 .badge { background:var(--me); color:#fff; } .h1 .badge, .c1 .badge { background:var(--ai); color:#fff; }
  .trait { font-size:13px; font-style:italic; color:#b9b091; }
  img.art { image-rendering:pixelated; display:block; width:100%; border:1px solid #000a; border-radius:3px; }
  /* Never squarer than the 160x72 art: on tall screens the spare height goes around the board;
     on short ones the image may shrink in height (cover crops top/bottom, it only gets wider). */
  .terrain img.art { flex:0 1 auto; width:100%; height:auto; aspect-ratio:160/72; min-height:0; object-fit:cover; }
  /* Action bar: one bar above the hand, its content follows the turn state (data-st: wait / idle / card / pend). */
  #bar { align-self:center; width:100%; max-width:1000px; min-height:64px; display:flex; align-items:center; gap:12px; padding:8px 12px; margin-bottom:14px; /* room for the selected card, raised 14px */
         border-radius:8px; background:var(--panel); border:1px solid var(--panelEdge); font-family:var(--ui); }
  #bar[data-st=card] { background:#1b2229; border:2px solid #8fc0ea; } #bar[data-st=pend] { background:#2e2a18; border:2px solid #e6cf7a; }
  #bar .turn { font:italic 16px Georgia,serif; color:#f0d98a; white-space:nowrap; }
  #bar .info { flex:1; border:1px dashed var(--edge); border-radius:6px; padding:9px 12px; font-size:13px; }
  #bar img.th { height:46px; border-radius:3px; image-rendering:pixelated; }
  #bar .what { flex:1; min-width:0; font-size:13px; } #bar .what b { font:bold 17px Georgia,serif; color:var(--paper); margin-right:8px; }
  #bar button { height:44px; padding:2px 14px; font:bold 13px/1.25 var(--ui); text-align:left; white-space:nowrap; }
  #bar button small { display:block; font-weight:normal; font-size:11px; opacity:.75; }
  #bar button.sec { background:#3a3622; border-color:#8a7f5a; } #bar button.sup { background:#3b4226; border-color:#8a9a52; }
  #bar button.out { background:transparent; border-color:var(--panelEdge); }
  #bar .seg { display:flex; gap:2px; padding:3px; border:1px solid var(--panelEdge); border-radius:6px; }
  #bar .seg button { height:36px; border:0; background:none; } #bar .seg button.on { background:#6fa8dc; color:#10161c; }
  kbd { font:11px var(--ui); border:1px solid; border-radius:3px; padding:0 4px; margin-left:6px; opacity:.8; }
  #hand { display:flex; justify-content:center; gap:8px; height:218px; }
  .card { position:relative; width:168px; background:var(--paper); color:var(--ink); border-radius:7px; border:2px solid #8a7a52; padding:6px 7px; cursor:pointer; display:flex; flex-direction:column; gap:3px; transition:transform .12s; }
  .card:hover { transform:translateY(-8px); } .card.sel { transform:translateY(-14px); border-color:#f0d98a; box-shadow:0 0 16px #f0d98a; }
  main[data-st=card] .card.sel { border-color:#8fc0ea; box-shadow:0 0 16px #8fc0ea; }
  .card.dim { opacity:.55; }
  /* Play aid: the cards suggested for the hovered terrain. */
  .card[data-tip] { opacity:1; outline:3px solid #9fd36a; outline-offset:1px; transform:translateY(-8px); }
  .card[data-tip]::before { content:attr(data-tip); position:absolute; top:-12px; left:50%; transform:translateX(-50%); z-index:1; padding:1px 8px; border-radius:9px;
                            white-space:nowrap; background:#9fd36a; color:#1a1a12; font:bold 11px/1.5 var(--ui); }
  .card.down::after { content:attr(data-down); position:absolute; inset:0; border-radius:5px; display:flex; align-items:center; justify-content:center;
                      background:repeating-linear-gradient(135deg,#000a 0 8px,#000c 8px 16px); color:#f0d98a; font:bold 16px var(--ui); letter-spacing:2px; text-transform:uppercase; }
  .card.order { background:#cbbfae; border-color:#6b4a7a; }
  .card b { font-size:15px; line-height:1.1; } .card small { font-size:10px; text-transform:uppercase; letter-spacing:1px; opacity:.65; }
  .card p { margin:0; font-size:12px; line-height:1.25; flex:1; overflow:hidden; }
  #end { position:fixed; inset:0; z-index:10; background:#000b; display:none; align-items:center; justify-content:center; flex-direction:column; gap:14px; }
  #end.show { display:flex; } #end h2 { font-family:var(--title); font-size:44px; margin:0; letter-spacing:4px; text-transform:uppercase; color:var(--paper); }
  #end .row { display:flex; gap:10px; } #end p { max-width:520px; text-align:center; margin:0; }
  #end.show { animation:fadein .6s both; }
  #bname { color:#f0d98a; font-style:italic; }
  /* Animations: one CSS class on the render that follows the event (render() rebuilds the board each time). */
  /* Battle start: terrains dealt face down and flipped one by one, then slots and hand. */
  .terrain.intro { animation:deal .8s calc(var(--i) * .55s) both; }
  .terrain.intro::after { content:''; position:absolute; inset:0; border-radius:6px; background:#000 var(--back) center/cover; image-rendering:pixelated; animation:back .8s calc(var(--i) * .55s) both; }
  @keyframes deal { 0% { opacity:0; transform:perspective(900px) translateY(-60px) rotateY(180deg); } 30% { opacity:1; transform:perspective(900px) rotateY(180deg); } 100% { transform:perspective(900px); } }
  @keyframes back { 0%, 64% { opacity:1; } 65%, 100% { opacity:0; } }
  .late { animation:fadein .5s calc(1.8s + var(--i, 0) * .07s) both; }
  @keyframes fadein { from { opacity:0; transform:translateY(16px); } }
  /* Capture: the card flips, a GAGNÉ / PERDU stamp slams down (and stays), a banner rises. */
  .terrain.fx { animation:flip .7s var(--d) both; }
  @keyframes flip { 50% { transform:perspective(900px) rotateY(90deg); } }
  .stamp { position:absolute; left:50%; top:54%; z-index:2; transform:translate(-50%,-50%) rotate(-12deg); padding:2px 16px; border:4px solid; border-radius:6px;
           font:bold 34px var(--title); letter-spacing:4px; text-transform:uppercase; background:#000b; pointer-events:none; white-space:nowrap; }
  .stamp.s0 { color:#8cc4f0; border-color:var(--me); } .stamp.s1 { color:#f39468; border-color:var(--ai); } .stamp.sx { color:var(--paper); border-color:#b9b091; }
  .fx .stamp { animation:stamp .45s calc(var(--d) + .5s) both; }
  .fx .badge { animation:fadein .3s calc(var(--d) + .6s) both; } /* no spoiler before the stamp */
  @keyframes stamp { from { opacity:0; transform:translate(-50%,-50%) rotate(-12deg) scale(3); } 70% { opacity:1; transform:translate(-50%,-50%) rotate(-12deg) scale(.92); } }
  .rise { position:absolute; left:0; right:0; top:-8px; z-index:3; text-align:center; font:bold 28px var(--title); letter-spacing:2px; text-shadow:0 2px 0 #000,0 0 14px currentColor; pointer-events:none; animation:rise 1.8s .8s both; }
  .rise.s0 { color:#a8d6ff; } .rise.s1 { color:#ff9f72; }
  @keyframes rise { from { opacity:0; transform:translateY(10px); } 20%, 70% { opacity:1; transform:translateY(-26px); } to { opacity:0; transform:translateY(-46px); } }
  /* Nightfall: the board goes dark for a moment, then the terrains are decided one by one. */
  #front { position:relative; }
  .nightfall { position:absolute; inset:-8px; z-index:4; display:flex; align-items:center; justify-content:center; font:bold 40px var(--title); letter-spacing:4px;
               color:#f0d98a; background:#060a18cc; pointer-events:none; animation:night 1.4s both; }
  @keyframes night { 0% { opacity:0; } 25%, 70% { opacity:1; } 100% { opacity:0; } }
  /* Who starts: a coin over the darkened screen. Tossed (.spin: it flips in the air and lands on the starter's face)
     or, when the scenario decides, simply laid down (.laid). Resting state = the final face: no motion needed to read it. */
  #toss { position:fixed; inset:0; z-index:9; display:none; flex-direction:column; align-items:center; justify-content:center; gap:28px; background:#0c0f09; }
  #toss.show { display:flex; }
  .coin { position:relative; width:160px; height:160px; transform-style:preserve-3d; transform:perspective(700px) rotateX(var(--end)); }
  .coin i { position:absolute; inset:0; background:center/100% no-repeat; image-rendering:pixelated; backface-visibility:hidden; }
  .coin i + i { transform:rotateX(180deg); }
  #toss p { margin:0; font:bold 26px var(--title); letter-spacing:2px; color:var(--paper); text-shadow:0 2px 0 #000; }
  .spin .coin { animation:toss 1.5s cubic-bezier(.3,.5,.4,1) both; } .spin p { animation:fadein .4s 1.5s both; }
  .laid .coin { animation:laid .45s ease-out both; } .laid p { animation:fadein .4s .4s both; }
  @keyframes toss { 0% { transform:perspective(700px) translateY(70px) scale(.7) rotateX(calc(var(--end) - 1800deg)); }
    45% { transform:perspective(700px) translateY(-150px) scale(1.2) rotateX(calc(var(--end) - 760deg)); }
    84% { transform:perspective(700px) rotateX(var(--end)); } 92% { transform:perspective(700px) translateY(-12px) rotateX(var(--end)); } }
  @keyframes laid { from { opacity:0; transform:perspective(700px) translateY(-40px) scale(1.3) rotateX(var(--end)); } }
  #brief .def { border-left:3px solid var(--me); padding-left:8px; font-size:13px; }
  #brief img.ic { width:16px; image-rendering:pixelated; vertical-align:-3px; }
  /* A unit leaving the board never just vanishes: destroyed = it shakes, flashes and bursts; back to hand = it slides toward its owner. */
  .u.gone, .u.away { position:fixed; z-index:5; flex:none; pointer-events:none; }
  .u.gone .pill, .u.away .pill { display:none; }
  .u.gone { animation:gone .75s ease-in both; } .u.away { animation:away .5s ease-in both; }
  @keyframes gone { 10%, 30% { transform:translateX(-4px) rotate(-2deg); } 20%, 40% { transform:translateX(4px) rotate(2deg); }
    50% { transform:scale(1.08); filter:brightness(2.2) sepia(1) saturate(5) hue-rotate(-25deg); box-shadow:0 0 22px #ff8a3c; }
    100% { opacity:0; transform:scale(1.35) rotate(7deg); filter:brightness(.5); } }
  @keyframes away { to { opacity:0; transform:translateY(var(--dy)) scale(.8); } }
  @media (prefers-reduced-motion: reduce) { *, ::after { animation:none !important; } }
  #peek { position:fixed; z-index:5; width:250px; pointer-events:none; display:none; cursor:default; box-shadow:0 10px 30px #000c; }
  #peek.show { display:flex; } #peek b { font-size:20px; } #peek small { font-size:12px; } #peek p { font-size:15px; flex:none; }
  #peek .vals i { font-size:22px; } #peek .note { font-size:13px; font-style:italic; opacity:.8; }
  #peek.side0 { border-color:var(--me); } #peek.side1 { border-color:var(--ai); }
  body:not([data-screen=game]) #peek { display:none; }
  button.danger { background:#6e2a1c; border-color:#d0663a; }
  /* Screens: one of menu / map / game is visible, driven by body[data-screen]. */
  #menu, #map { position:fixed; inset:0; display:none; }
  body[data-screen=menu] #menu, body[data-screen=map] #map { display:flex; }
  body:not([data-screen=game]) #top, body:not([data-screen=game]) #wrap, body:not([data-screen=game]) #end, body:not([data-screen=game]) #toss { display:none !important; }
  /* Main menu: belongs to no era. Neutral charcoal and brass; behind it, one slanted strip per era's cover picture. */
  #menu { flex-direction:column; align-items:center; justify-content:center; gap:12px; background:#0b0b0a; overflow:hidden;
          --btn:#2c2a26; --btnHi:#3d3a33; --edge:#8a7650; --olive:#5e4d2c; }
  #menu > .covers { position:absolute; inset:0; display:flex; z-index:0; }
  .covers div { flex:1; margin:0 -3%; background:center/cover no-repeat; image-rendering:pixelated; transform:skewX(-9deg); border-right:4px solid #0b0b0a; filter:saturate(.6) brightness(.75); }
  #menu::before { content:''; position:absolute; inset:0; z-index:1; background:radial-gradient(ellipse at 50% 45%,#0009,#000e); }
  #menu > :not(.covers) { position:relative; z-index:2; }
  #menu h1 { margin:0; font:normal 60px Georgia,"Times New Roman",serif; font-variant:small-caps; letter-spacing:10px; color:var(--paper); text-shadow:0 3px 0 #000; }
  #menu h2 { margin:0 0 8px; font:normal 30px Georgia,serif; font-variant:small-caps; letter-spacing:6px; color:var(--paper); }
  #menu .sub { margin:0 0 18px; color:#d9b56a; letter-spacing:4px; text-transform:uppercase; font-size:13px; }
  #menu .sub::before, #menu .sub::after { content:'—'; margin:0 12px; opacity:.6; }
  #menu button { width:300px; font-size:18px; padding:10px; } #menu .row { display:flex; gap:10px; } #menu .row button { width:145px; font-size:14px; } #menu small { color:#b9b091; }
  /* Campaign / era tiles: the era's own picture and lettering. */
  #menu .tiles { display:flex; flex-wrap:wrap; justify-content:center; gap:18px; margin-bottom:10px; }
  #menu button.tile { width:330px; height:190px; padding:0 0 12px; display:flex; flex-direction:column; justify-content:flex-end; align-items:flex-start; gap:2px; text-align:left;
                      background:#000 var(--img) center/cover no-repeat; image-rendering:pixelated; border:2px solid var(--edge); border-radius:8px; overflow:hidden; position:relative; transition:transform .12s; }
  #menu button.tile::before { content:''; position:absolute; inset:0; background:linear-gradient(#0000 25%,#000d 80%); }
  #menu button.tile:hover { transform:translateY(-4px); border-color:#f0d98a; background:#000 var(--img) center/cover no-repeat; }
  .tile > * { position:relative; padding:0 14px; }
  .tile .era { font-size:10px; letter-spacing:2px; white-space:nowrap; text-transform:uppercase; color:#d9b56a; }
  .tile b { font-size:26px; line-height:1.1; font-weight:700; letter-spacing:3px; text-transform:uppercase; color:var(--paper); text-shadow:0 2px 0 #000; }
  #menu .tile small { color:#d8cfae; font-size:13px; }
  #map { gap:16px; padding:16px; background:var(--bg3); }
  #mapbox { flex:1; position:relative; align-self:center; aspect-ratio:320/140; max-height:100%; }
  #mapbox img { width:100%; height:100%; display:block; image-rendering:pixelated; border:2px solid var(--edge); border-radius:6px; }
  #mapbox svg { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; }
  .node { position:absolute; transform:translate(-50%,-50%); display:flex; flex-direction:column; align-items:center; gap:2px; cursor:pointer; background:none; border:0; padding:0; }
  .node i { width:22px; height:22px; border-radius:50%; border:3px solid #1c1a10; background:#8a8570; box-shadow:0 0 0 2px #0008; }
  .node span { font-size:13px; white-space:nowrap; color:var(--paper); background:#000c; padding:1px 6px; border-radius:3px; }
  .node.open i { background:#f0d98a; animation:pulse2 1.2s infinite; } .node.won i { background:var(--me); }
  .node.east span { align-self:flex-end; margin-right:-11px; } /* keep Paris' label inside the map */
  .node.locked { cursor:default; opacity:.55; } .node.sel span { outline:2px solid #f0d98a; }
  @keyframes pulse2 { 50% { box-shadow:0 0 0 6px #f0d98a55; } }
  #brief { width:340px; display:flex; flex-direction:column; gap:10px; background:#0006; border:1px solid #000; border-radius:8px; padding:14px; overflow:auto; }
  #brief h2 { margin:0; font-family:var(--title); font-size:22px; color:var(--paper); letter-spacing:1px; text-transform:uppercase; } #brief .date { color:#f0d98a; font-style:italic; }
  #brief .pool { display:grid; grid-template-columns:1fr 1fr; gap:6px; } #brief .pool div { font-size:11px; color:#b9b091; }
  #brief .pool img { width:100%; image-rendering:pixelated; display:block; border-radius:3px; }
  #brief .sp { flex:1; }
  /* Campaign run: fog of war, abandoned branches, rewards, army. */
  .node.fog i { background:#5d5a48; } .node.fog span { opacity:.75; }
  .node.gone { opacity:.35; cursor:default; } .node.gone span { text-decoration:line-through; }
  #brief h3 { margin:4px 0 0; font-size:13px; letter-spacing:2px; text-transform:uppercase; color:#f0d98a; }
  #brief .fog, #brief .gone { font-style:italic; color:#b9b091; margin:0; }
  #brief .card.mini { width:190px; align-self:center; cursor:default; } #brief .card.mini:hover { transform:none; }
  #brief > .vals { align-items:center; } #brief > .vals i { flex:none; padding:0 8px; font-size:14px; }
  .pw { border:1px solid #c9a94a; border-radius:6px; padding:6px 8px; background:#3b3420; color:var(--paper); }
  .pw small { display:block; color:#d8cfae; font-size:12px; }
  .army { display:flex; flex-wrap:wrap; gap:4px; } .army span { font-size:12px; padding:1px 6px; border-radius:9px; background:#0006; border:1px solid var(--edge); }
  .army span.p { border-color:#c9a94a; color:#f0d98a; }
  .card.vet, .u.vet { box-shadow:0 0 0 2px #e2bd4a inset, 0 0 10px #e2bd4a66; }
  #bar button.pw { padding:5px 10px; } #bar button.pw.on { background:#6b5a24; border-color:#f0d98a; }
</style>
</head>
<body>
<div id="menu"></div>
<div id="map"><div id="mapbox"></div><aside id="brief"></aside></div>
<div id="top">
  <h1>Ligne de Front</h1>
  <span id="bname"></span><span id="clock"></span><span id="score"></span><span class="sp"></span>
  <button data-go="mus" class="snd"></button><button data-go="sfx" class="snd"></button>
  <button data-go="lang" class="lng"></button><button data-go="diff" class="dif"></button><button data-go="help" class="hlp"></button><button id="toMenu"></button><button id="toMap"></button><button id="restart"></button>
</div>
<div id="wrap">
  <aside id="log"></aside>
  <main>
    <div id="ai"></div>
    <div id="front"></div>
    <div id="bar"></div>
    <div id="hand"></div>
  </main>
</div>
<div id="end"></div>
<div id="toss"></div>
<div id="peek" class="card"></div>
<script src="engine.js?v=6"></script>
<!-- Campaign packs: one folder each (see README, "Adding a campaign"); same list as packs/index.cjs.
     ?v=N: bump it on every release so browsers drop their cached copy (old and new files mixed = blank page). -->
<script src="packs/normandie/pack.js?v=6"></script>
<script src="packs/normandie/cards.js?v=6"></script>
<script src="packs/normandie/terrains.js?v=6"></script>
<script src="packs/normandie/battles.js?v=6"></script>
<script src="packs/verdun/pack.js?v=6"></script>
<script src="packs/verdun/cards.js?v=6"></script>
<script src="packs/verdun/terrains.js?v=6"></script>
<script src="packs/verdun/battles.js?v=6"></script>
<script src="campaign.js?v=6"></script>
<script src="audio.js?v=6"></script>
<script src="i18n.js?v=6"></script>
<script>
// Battle UI + campaign map + localStorage save. Campaign content comes from the active pack (packs/<id>/).
// ---- campaign packs (packs/<id>/): the active one gives cards, terrains, art, map and texts ------------
const PACK_IDS = Object.keys(PACKS).filter(id => !PACKS[id].hidden).sort((a, b) => parseInt(PACKS[a].era.years) - parseInt(PACKS[b].era.years)); // chronological
let ICON = []; // attribute icons of the active pack (value chips)
const ART = () => E.PACK.art;
function usePack(id) {
  if (E.PACK && E.PACK.id === id) return;
  E.use(id); C.use(id);
  ICON = E.PACK.icons.map(n => `<img src="${ART()}sprites/i_${n}.png" alt="">`);
  document.body.style.setProperty('--back', `url(${ART()}scenes/c_back.png)`);
  // Era look: the pack's theme colours (CSS variables, the defaults are Normandy's) and title lettering.
  const th = E.PACK.theme || {};
  for (const k of THEME) th[k] ? document.body.style.setProperty('--' + k, th[k]) : document.body.style.removeProperty('--' + k);
  document.body.dataset.font = E.PACK.font || '';
}
const THEME = ['olive', 'btn', 'btnHi', 'edge', 'bg1', 'bg2', 'bg3', 'panel', 'panelEdge', 'tile1', 'tile2'];
// Eras: campaigns grouped by pack.era.key, in load order. A quick battle uses the first campaign of its era.
const ERAS = [...new Set(PACK_IDS.map(id => PACKS[id].era.key))].map(key => PACK_IDS.find(id => PACKS[id].era.key === key));
const coverOf = id => `${PACKS[id].art}scenes/t_${PACKS[id].terrains[PACKS[id].cover].art || PACKS[id].cover}.png`;
const titleFont = P => P.font === 'serif' ? 'Georgia,serif' : '"Stardos Stencil",Georgia,serif';
let menuView = 'main'; // main · campaign (pick a campaign) · quick (pick an era)
const $ = id => document.getElementById(id);
// sel = { c: hand card id | 'p:<power>', pre: clicks so far }; hiddenMode = the selected card goes face down (reset on every selection);
// flipHint = highlight my face-down cards; view = the board as the player may know it; pvBase = previewed board in a pending power.
let s, sel = null, hiddenMode = false, flipHint = false, busy = false, pick = null, view = null, pvBase = null;
// Animation state: intro = deal the terrains on this render; fx = captures to animate on the next render;
// endShown = false while the board stays visible after the decisive capture.
let intro = false, fx = null, endShown = true;
const FX_MS = 1600, NIGHT_MS = 1000, STEP_MS = 900, LOOK_MS = 1500, INTRO_MS = 2300, TOSS_MS = 2700, LAID_MS = 1600;
const fxMs = f => !f ? 0 : f.night ? NIGHT_MS + STEP_MS * (f.caps.length - 1) + FX_MS : FX_MS;
const C = CAMPAIGN, SAVE = 'ldf-v1', I = I18N, L = I18N.t;
// Language: saved choice, else English unless the browser is French.
try { I.lang = localStorage.getItem('ldf-lang') || (navigator.language.startsWith('fr') ? 'fr' : 'en'); } catch { I.lang = 'fr'; }
const B = id => I.battle(C.byId[id]);

// ---- save: { won: [battle ids], cur: { mode: 'campagne'|'rapide', battle, s } } -----------------
// The engine state is plain JSON, so the whole battle is saved after every action.
let save = (() => { try { return JSON.parse(localStorage.getItem(SAVE)) || null; } catch { return null; } })() || { won: [], cur: null };
save.diff = save.diff || 'normal'; // saves from before difficulty levels
// One campaign run per pack (campaign.js): rewards, path taken, cards and powers earned.
// Older saves held a single Normandy run (save.run) or a list of won battles (save.won).
save.runs = save.runs || {};
if (save.run) { save.runs.normandie = save.run; delete save.run; }
delete save.won;
save.pack = PACKS[save.pack] && !PACKS[save.pack].hidden ? save.pack : PACK_IDS[0];
usePack(save.pack);
const runNow = () => save.runs[E.PACK.id] || (save.runs[E.PACK.id] = C.newRun()); // run of the active pack
const camp = () => save.cur && save.cur.mode === 'campagne';
const total = () => s.winner === 0 && s.terrains.every(T => T.captured === 0); // total victory: all three terrains
const persist = () => { try { localStorage.setItem(SAVE, JSON.stringify(save)); } catch { /* no storage: play without save */ } };
const screen = name => { document.body.dataset.screen = name; SND.setMood(name === 'game' ? 'battle' : 'calm'); if (name === 'menu') renderMenu(); if (name === 'map') renderMap(); };
const terrainArt = key => `${ART()}scenes/t_${E.TERRAINS[key].art || key}.png`;

const myTurn = () => s.winner === null && s.turn === 0 && !busy;
// Fog terrain (Forêt): every unit lands face down there without the player asking, and keeps its values. The UI says so,
// so that it does not read as a bluffed card (worth 0).
const fogAt = t => !!(E.PACK.traits[E.TERRAINS[s.terrains[t].key].trait] || {}).fog;
const fogged = (u, t) => u.down && u.owner === 0 && fogAt(t) && E.CARDS[u.key].type !== E.ORDER;
// Legal moves matching the selected card, the visible/face-down toggle and the clicks so far.
const cands = () => !sel ? [] : E.moves(s).filter(m => m.c === sel.c
  && (m.kind === 'power' || (hiddenMode ? m.kind === 'hidden' : m.kind === 'deploy' || m.kind === 'order'))
  && sel.pre.every((x, i) => m.steps[i] === x));
const nextSteps = c => new Set((c || cands()).map(m => m.steps[sel.pre.length]).filter(Boolean));
// Illustrations built by pxl from art.px.js; enemy units use the feldgrau variant, face-down cards the back.
const art = (key, owner, down) => `${ART()}scenes/c_${down ? 'back' : (E.CARDS[key].art || key) + (owner && E.CARDS[key].type !== E.ORDER ? '_x' : '')}.png`;
// Board units drop the icon (too narrow): column position + colour carry the attribute.
const valsHTML = (v, icon = true) => v.map((x, a) => `<i class="c${a}a ${x ? '' : 'z'}" title="${I.attrName(a)}">${icon ? ICON[a] : ''}${x}</i>`).join('');

// Card face, as in the hand. Also used by the hover zoom on board units.
// Printed values: a veteran gets +1 in the main attribute of its type.
const baseV = (key, vet) => { const C = E.CARDS[key], v = C.v.slice(); if (vet) v[E.MAIN[C.type]]++; return v; };
const nameV = (key, owner, vet) => (vet ? '★ ' : '') + I.cardName(key, owner);
function cardInner(key, owner, vet) {
  const C = E.CARDS[key], order = C.type === 'Ordre';
  return `<img class="art" src="${art(key, owner)}" alt=""><b>${nameV(key, owner, vet)}</b><small>${I.typeName(C.type)}${vet ? ' · ' + L('vet') : ''}</small>${order ? '' : `<span class="vals">${valsHTML(baseV(key, vet))}</span>`}<p>${I.cardText(key) || L('noPower')}</p>`;
}
// Hover zoom: a board unit is too small to read, show it full size next to the pointer.
function peek(e) {
  const el = e.target.closest('.u'), box = $('peek');
  if (!el) return box.classList.remove('show');
  const id = +el.dataset.step.slice(1), t = +el.closest('.col').dataset.step.slice(1);
  const u = s.terrains[t].side.flat().find(x => x.id === id);
  if (!u) return box.classList.remove('show');
  const secret = u.down && u.owner === 1 && s.winner === null, C = E.CARDS[u.key];
  const now = E.vals(s, u, t), base = baseV(u.key, u.vet), moved = C.type !== 'Ordre' && now.some((x, a) => x !== base[a]);
  box.className = `card show side${u.owner} ${C.type === 'Ordre' && !secret ? 'order' : ''} ${u.vet && !secret ? 'vet' : ''}`;
  box.innerHTML = secret ? `<img class="art" src="${art(u.key, 1, true)}" alt=""><b>${L('secret')}</b><small>${L('unknown')}</small><p>${L('secretText')}</p>`
    : cardInner(u.key, u.owner, u.vet) + (u.down ? `<p class="note">${L(fogged(u, t) ? 'fogNote' : 'downNote')}</p>` : '')
      + (moved && !u.down ? `<div class="note">${L('here', I.terrainName(s.terrains[t].key))}</div><span class="vals">${valsHTML(now)}</span>` : '');
  const r = el.getBoundingClientRect(), w = box.offsetWidth, h = box.offsetHeight;
  const x = r.right + 12 + w < innerWidth ? r.right + 12 : r.left - 12 - w;
  box.style.left = Math.max(8, x) + 'px';
  box.style.top = Math.min(innerHeight - h - 8, Math.max(8, r.top + r.height / 2 - h / 2)) + 'px';
}

const coinArt = p => `${ART()}sprites/coin_${p}.png`; // the two faces of the initiative coin: 0 the player, 1 the enemy
// Who starts, shown before the terrains are dealt: the coin is tossed, or laid down when the scenario decides. Returns how long it lasts.
function toss(first, tossed) {
  $('toss').className = 'show ' + (tossed ? 'spin' : 'laid');
  $('toss').innerHTML = `<div class="coin" style="--end:${first * 180}deg"><i style="background-image:url(${coinArt(0)})"></i><i style="background-image:url(${coinArt(1)})"></i></div>
    <p>${L((tossed ? 'toss' : 'script') + (first ? 'Ai' : 'You'))}</p>`;
  if (tossed) SND.play('coin');
  SND.play('card', tossed ? 1.25 : 0.3);
  return tossed ? TOSS_MS : LAID_MS;
}
// Both modes play with the total victory rule. Who starts: the battle's scenario in a campaign (first: 0 the player,
// 1 the AI), else a coin toss, thrown again on every new attempt.
function startBattle(mode, battle) {
  usePack(save.pack);
  const camp = mode === 'campagne', script = camp ? C.byId[battle].first : undefined, first = script ?? (Math.random() < 0.5 ? 0 : 1);
  const defender = camp && C.byId[battle].defend ? 0 : 1; // defensive scenario: the player keeps the ground at nightfall
  s = E.newGame(camp ? C.draw(C.byId[battle]) : E.randomTerrains(), camp ? { cards: runNow().cards, powers: runNow().powers } : {}, { total: true, first, defender });
  s.log.push({ e: 'first', p: first });
  save.cur = { mode, battle, s }; sel = null; hiddenMode = false; fx = null; endShown = true;
  busy = true; persist(); screen('game'); render();
  const mine = s, later = (f, ms) => setTimeout(() => { if (s === mine) f(); }, ms);
  later(() => {
    $('toss').className = ''; intro = true; render(); intro = false;
    if (E.PACK.startSound) SND.play(E.PACK.startSound);
    s.terrains.forEach((T, t) => SND.play('flip', 0.45 + 0.55 * t));
    later(() => { busy = false; render(); if (s.turn === 1) aiTurn(); }, INTRO_MS);
  }, toss(first, script == null));
}
function resume() {
  s = save.cur.s; save.pack = s.pack || 'normandie'; usePack(save.pack); sel = null; busy = false; fx = null; endShown = true; screen('game'); render();
  if (s.winner === null && s.turn === 1) aiTurn(); // saved while the AI was thinking
}
// Two-click confirmation inside the page (no confirm() dialog).
function armed(btn) {
  if (btn.dataset.armed) return true;
  btn.dataset.armed = btn.textContent; btn.textContent = L('confirm'); btn.classList.add('danger');
  setTimeout(() => { if (btn.dataset.armed) { btn.textContent = btn.dataset.armed; delete btn.dataset.armed; btn.classList.remove('danger'); } }, 3000);
  return false;
}

function renderMenu() {
  const live = save.cur && save.cur.s.winner === null;
  const P0 = live && PACKS[save.cur.s.pack || 'normandie'];
  const where = live ? (save.cur.mode === 'campagne' ? I.tx(P0.battles.find(b => b.id === save.cur.battle).name) : L('quick')) : '';
  const tile = (id, attr, lines) => `<button class="tile" ${attr}="${id}" style="--img:url(${coverOf(id)})">${lines}</button>`;
  const covers = `<div class="covers">${ERAS.map(id => `<div style="background-image:url(${coverOf(id)})"></div>`).join('')}</div>`;
  const era = P => `${I.tx(P.era)} · ${P.era.years}`;
  const stage = id => { const run = save.runs[id]; return run ? run.path.length + (run.path.some(b => !PACKS[id].battles.find(x => x.id === b).next.length) ? 0 : 1) : 1; };
  $('menu').innerHTML = covers + (menuView === 'campaign' ? `<h2>${L('chooseCampaign')}</h2>
    <div class="tiles">${PACK_IDS.map(id => { const P = PACKS[id];
      return tile(id, 'data-camp', `<span class="era">${era(P)}</span><b style="font-family:${titleFont(P)}">${I.pack('title', P)}</b><small>${I.pack('dates', P)} · ${L('battles', P.battles.length)}</small><small>${L('campaign')} · ${L('stage', stage(id))}</small>`); }).join('')}</div>
    <button data-go="menuBack">${L('back')}</button>`
  : menuView === 'quick' ? `<h2>${L('chooseEra')}</h2>
    <div class="tiles">${ERAS.map(id => { const P = PACKS[id];
      return tile(id, 'data-quick', `<b style="font-family:${titleFont(P)}; font-size:21px">${I.tx(P.era)}</b><small>${P.era.years}</small>`); }).join('')}</div>
    <button data-go="menuBack">${L('back')}</button>`
  : `<h1>${L('title')}</h1><p class="sub">${L('tagline')}</p>
    ${live ? `<button data-go="resume" class="on">${L('resume', where)}</button>` : ''}
    <button data-go="menuCampaign">${L('campaign')}</button>
    <button data-go="menuQuick">${L('quick')}</button>
    <div class="row"><button data-go="mus" class="snd"></button><button data-go="sfx" class="snd"></button></div>
    <div class="row"><button data-go="lang" class="lng"></button><button data-go="diff" class="dif"></button></div>
    <small id="diffTip"></small>`);
  sndLabels(); langLabels();
}

// Reward preview: a card face, a power box, or nothing.
function rewardHTML(r) {
  if (!r || r.t === 'none') return `<p class="fog">${L('rewardNone')}</p>`;
  if (r.t === 'power') return `<div class="pw">⚡ <b>${I.powerName(r.key)}</b><small>${I.powerText(r.key)}</small><small><i>${L('powerNote')}</i></small></div>`;
  return `<div class="card mini ${r.t === 'vet' ? 'vet' : ''}">${cardInner(r.key, 0, r.t === 'vet')}</div>
    <small>${r.t === 'vet' ? L('vetNote') : L('newCard')}</small>`;
}
const rewardName = r => r.t === 'power' ? '⚡ ' + I.powerName(r.key) : nameV(r.key, 0, r.t === 'vet');
// Ground profile of a battle: the 1-2 attributes its terrain pool asks for clearly more than the
// campaign average (every battle needs infantry, so raw totals would all read "Infanterie").
const need = b => [0, 1, 2, 3].map(a => b.pool.reduce((n, k) => n + E.TERRAINS[k].thr[a], 0));
function profile(b) {
  const avg = [0, 1, 2, 3].map(a => C.BATTLES.reduce((n, x) => n + need(x)[a], 0) / C.BATTLES.length);
  const r = need(b).map((x, a) => x / avg[a]), top = [0, 1, 2, 3].filter(a => r[a] >= 1.12).sort((x, y) => r[y] - r[x]).slice(0, 2);
  return top.length ? top.map(a => `<i class="c${a}a">${ICON[a]}${I.attrName(a)}</i>`).join('') : `<span>${L('balanced')}</span>`;
}
function renderMap() {
  const run = runNow(), st = b => C.status(b.id, run.path), xy = b => C.project(b.pos).map(v => 100 * v);
  const last = run.path[run.path.length - 1];
  const links = C.BATTLES.flatMap(b => b.next.map(n => { const [x1, y1] = xy(b), [x2, y2] = xy(C.byId[n]);
    const taken = run.path.includes(b.id) && run.path.includes(n), ahead = b.id === last;
    const dead = st(b) === 'gone' || st(C.byId[n]) === 'gone' || (run.path.includes(b.id) && b.id !== last && !taken);
    const [col, op] = taken || ahead ? ['#f0d98a', 1] : dead ? ['#1c1a10', 0.15] : ['#1c1a10', 0.55];
    return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${col}" stroke-opacity="${op}" stroke-width="${taken ? 3.5 : 2.5}" ${taken ? '' : 'stroke-dasharray="7 5"'} vector-effect="non-scaling-stroke"/>`; })).join('');
  $('mapbox').innerHTML = `<img src="${ART()}scenes/${E.PACK.map.image}.png" alt="${L('mapAlt')}">
    <svg viewBox="0 0 100 100" preserveAspectRatio="none">${links}</svg>` +
    C.BATTLES.map(b => { const [x, y] = xy(b);
      return `<button class="node ${st(b)} ${b.id === pick ? 'sel' : ''} ${x > 90 ? 'east' : ''}" data-pick="${b.id}" style="left:${x}%;top:${y}%"><i></i><span>${I.battle(b).name}</span></button>`; }).join('');
  const b = B(pick), state = st(b), r = run.rewards[b.id], bonus = (run.bonus || {})[b.id], choices = C.open(run.path).length;
  const army = [...run.cards.map(c => `<span>${nameV(c.key, 0, c.vet)}</span>`), ...run.powers.map(k => `<span class="p">⚡ ${I.powerName(k)}</span>`)];
  $('brief').innerHTML = `<h2>${b.name}</h2><div class="date">${b.date}</div><p>${b.brief}</p>
    <div class="vals">${L('profile')}${L('colon')}${profile(b)}</div>
    <div>${L('init')}${L('colon')}${(b.first == null ? [0, 1] : [b.first]).map(p => `<img class="ic" src="${coinArt(p)}" alt="">`).join(' ')} <b>${L(b.first === 0 ? 'initYou' : b.first === 1 ? 'initAi' : 'initToss')}</b></div>
    ${b.defend ? `<div class="def"><b>${L('defend')}</b>${L('colon')}${L('defendTip')}</div>` : ''}
    <div>${L('pool')}</div>
    <div class="pool">${b.pool.map(k => `<div><img src="${terrainArt(k)}" alt="">${I.terrainName(k)}</div>`).join('')}</div>
    ${C.last(b.id) ? '' : state === 'open' ? `<h3>${L('reward')}</h3>${rewardHTML(r)}<small>${L('totalHint')}</small>`

  sel = null; hiddenMode = flipHint = false; endShown = s.winner === null; busy = s.winner !== null || s.turn === 1 || ms > 0;
  played(); leave(was);
  if (s.winner !== null) later(() => { endShown = true; SND.play(s.winner === 0 ? 'victory' : 'defeat'); render(); }, ms + LOOK_MS);
  else if (s.turn === 1) aiTurn(ms);
  else if (ms) later(() => { busy = false; render(); }, ms);
}
function step(x) {
  sel.pre.push(x);
  const c = cands(), exact = c.find(m => m.steps.length === sel.pre.length);
  exact && c.length === 1 && !wasted(exact) ? commit(exact) : render();
}
// Innermost [data-step] ancestor that is a legal next step (a unit sits inside its terrain column).
function stepEl(target, next) {
  let el = target.closest('[data-step]');
  while (el && !next.has(el.dataset.step)) el = el.parentElement && el.parentElement.closest('[data-step]');
  return el;
}

// Way out of the current state: a pending power or order goes back to the selected card, a selected card to the start of the turn.
function cancel() {
  if (sel && sel.pre.length) sel.pre = []; else sel = null;
  hiddenMode = flipHint = false; render();
}
document.addEventListener('keydown', e => {
  if (document.body.dataset.screen !== 'game' || !myTurn() || e.repeat || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === 'Escape' && (sel || flipHint)) cancel();
  else if (e.key.toLowerCase() === 'c' && handCard() && !sel.pre.length) { hiddenMode = !hiddenMode; render(); }
});
$('front').addEventListener('mouseover', peek);
$('front').addEventListener('mouseover', hoverPreview);
$('front').addEventListener('mouseover', showTips);
$('front').addEventListener('mouseleave', () => showTips());
$('front').addEventListener('mouseleave', () => $('peek').classList.remove('show'));
document.addEventListener('click', e => {
  if (e.target.closest('button,[data-pick]')) SND.play('click');
  const go = e.target.closest('[data-go],[data-pick],[data-camp],[data-quick],#toMenu,#toMap,#restart');
  if (go) {
    const g = go.dataset.go || go.id;
    if (g === 'lang') {
      I.lang = I.lang === 'fr' ? 'en' : 'fr';
      try { localStorage.setItem('ldf-lang', I.lang); } catch { /* not saved */ }
      const sc = document.body.dataset.screen; sndLabels(); langLabels();
      return sc === 'game' ? render() : screen(sc);
    }
    if (g === 'help') { save.help = !save.help; persist(); helpLabels(); return showTips(); }
    if (g === 'diff') { save.diff = DIFFS[(DIFFS.indexOf(save.diff) + 1) % 3]; persist(); return diffLabels(); }
    if (g === 'mus' || g === 'sfx') { const k = g === 'mus' ? 'music' : 'sfx'; SND.set(k, !SND.pref[k]); return sndLabels(); }
    if (go.dataset.pick) { pick = go.dataset.pick; return renderMap(); }
    if (g === 'resume') return resume();
    if (g === 'menuCampaign' || g === 'menuQuick' || g === 'menuBack') { menuView = { menuCampaign: 'campaign', menuQuick: 'quick' }[g] || 'main'; return renderMenu(); }
    if (go.dataset.camp || go.dataset.quick) { save.pack = go.dataset.camp || go.dataset.quick; persist(); }
    if (go.dataset.quick) { menuView = 'main'; return startBattle('rapide'); }
    if (go.dataset.camp) { menuView = 'main'; usePack(save.pack); pick = save.cur && camp() && save.cur.s.pack === save.pack ? save.cur.battle : C.open(runNow().path)[0] || C.BATTLES.find(b => C.last(b.id)).id; return screen('map'); }
    if (g === 'reset') { if (armed(go)) { usePack(save.pack); save.cur = null; save.runs[save.pack] = C.newRun(); persist(); pick = C.open([])[0]; screen(document.body.dataset.screen); } return; }
    if (g === 'launch') return C.status(pick, runNow().path) === 'open' && startBattle('campagne', pick);
    if (g === 'again' || (g === 'restart' && armed(go))) return startBattle(save.cur.mode, save.cur.battle);
    // The map opens on the battle just played, finished or not (a resumed battle never went through the map: pick was still unset).
    if (g === 'map' || g === 'toMap') { if (save.cur) pick = save.cur.battle; if (save.cur && save.cur.s.winner !== null) save.cur = null, persist(); return screen('map'); }
    if (g === 'menu' || g === 'toMenu') { if (save.cur && save.cur.s.winner !== null) save.cur = null, persist(); return screen('menu'); }
    return;
  }
  if (document.body.dataset.screen !== 'game' || !myTurn()) return;
  const act = (e.target.closest('[data-act]') || e.target).dataset.act, next = sel ? nextSteps() : new Set();
  if (act === 'up' || act === 'down') { hiddenMode = act === 'down'; return render(); }
  if (act === 'flip') { flipHint = !flipHint; return render(); }
  if (act === 'cancel') return cancel();
  if (act === 'supply') return commit(E.moves(s).find(m => m.kind === 'supply' && m.c === sel.c));
  if (act === 'ok') return commit(cands().find(m => m.steps.length === sel.pre.length));
  const pb = e.target.closest('[data-power]');
  if (pb) { // power: fires at once without a target, otherwise waits for one like a card
    sel = sel && sel.c === 'p:' + pb.dataset.power ? null : { c: 'p:' + pb.dataset.power, pre: [] };
    const c = sel ? cands() : [];
    if (c.length === 1 && !c[0].steps.length) return commit(c[0]);
    return render();
  }
  const fl = e.target.closest('[data-flip]');
  if (fl) return commit(E.moves(s).find(m => m.kind === 'reveal' && m.u === +fl.dataset.flip));
  const h = e.target.closest('[data-hand]');
  if (h) {
    const id = +h.dataset.hand;
    if (next.has('h' + id)) return step('h' + id);
    sel = sel && sel.c === id && !sel.pre.length ? null : { c: id, pre: [] };
    hiddenMode = flipHint = false; // face down is chosen per card: every new selection starts face up
    if (sel) SND.play('card');
    return render();
  }
  const el = sel && stepEl(e.target, next);
  if (el) step(el.dataset.step);
});

sndLabels(); langLabels();
screen('menu');
</script>
